# ==========================================
# VolunteerHub - Application Properties
# ==========================================

# Database Configuration:
# Defaults to in-memory H2 with PostgreSQL compatibility mode for local development.
# For production (e.g. Neon PostgreSQL on Render), specify DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:shifts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate & JPA:
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Security & JWT
# Note: For production, set JWT_SECRET to a secure 256-bit+ random secret.
app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-secure-key-32chars}

# Server & Management
server.port=${PORT:8080}
server.error.include-message=always
management.endpoints.web.exposure.include=health

# CORS - Allowed Frontend Origins (Comma-separated for multiple origins)
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:8080}
